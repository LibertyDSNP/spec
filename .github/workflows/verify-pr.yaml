name: Verify PR
permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node Modules
        run: npm ci

      - name: Lint and Spellcheck
        run: npm run lint

      - name: Build and Linkcheck
        run: npm run build && npm run linkcheck
